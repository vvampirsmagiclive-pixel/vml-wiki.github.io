const fcard=f=>`<button class="fc ${f.c}" data-go="faction-${f.id}"><div class="art">${art(ART[f.id],f.id)}</div><div class="bd"><h3>${f.name}</h3><p>${f.intro}</p><p style="color:var(--tx)">${f.st}</p><span class="go">Learn more →</span></div></button>`;
const P={};
P.home={t:'Home',h:()=>`<div class="hero"><div class="bgart">${art('home',1)}</div><div class="in"><span class="tag">The official wiki &middot; Minecraft 1.20.1</span><h1>Enter the <span>Nightbound</span> world.</h1><p>Explore VML's factions, progression, rules, and community systems in one place. Whether you're choosing a path, preparing for clan warfare, or just getting started, this wiki is built to help you navigate the server quickly.</p><div class="row">${ext('Join the Discord',DC)}${go('join','Getting started')}</div></div></div><section class="blk"><div class="wrap"><h2 style="margin-top:0">Four factions. One world to shape.</h2><p class="lead">Understand strengths, weaknesses, counters, and progression before you choose your path.</p><div class="fgrid" style="margin-top:1.5rem">${FA.map(fcard).join('')}</div></div></section><section class="blk" style="padding-top:0"><div class="wrap"><h2 style="margin-top:0">Survive. Compete. Leave a mark.</h2><div class="split" style="margin-top:1.4rem"><button class="pc" data-go="clan-wars"><div class="bgart">${art('war','clans')}</div><div class="tx"><h3>Clan Wars</h3><p>Territory, claims, clans, and long-term strategy.</p></div></button><button class="pc" data-go="minigames"><div class="bgart">${art('mini','mini')}</div><div class="tx"><h3>Minigames</h3><p>Fast rounds, competitive play, and separate progression.</p></div></button></div></div></section></div>`};
P.join={t:'Getting Started',h:()=>ph('home','Begin your journey','Getting Started','Prepare for VML without guessing at details the project has not published.')+`<section class="blk"><div class="wrap"><div class="article"><div><div class="panel"><h3>Start here</h3><p>Before you build or fight, check the server's current rules and make sure your playstyle matches the version you're joining.</p>${ol(['Read the official rules before participating in PvP, clans, or economy systems.','Choose a faction based on your preferred role: blood magic, pack combat, anti-vampire research, or mystical spellcasting.','Use Discord for announcements, staff contact, and group coordination.'])}</div><div class="panel" style="margin-top:18px"><h3>Useful commands</h3>${CMDS.map(([c,e])=>cmd(c,e,'')).join('')}</div></div><aside class="aside"><h3>Quick checklist</h3><p>Learn the faction system, understand rules, and join the community before committing to a long-term build.</p><ul class="bl"><li>Check the current Discord and server status</li><li>Pick a faction that matches your playstyle</li><li>Understand Clan Wars basics before large-scale territory play</li><li>Verify mechanics in-game when version-sensitive details differ</li></ul></aside></div></div></section>`};
P.factions={t:'Factions',h:()=>ph('home','Find your alignment','The Four Factions','Compare the actual playstyle, strengths, vulnerabilities, and progression considerations of each path.')+`<section class="blk"><div class="wrap"><div class="fgrid">${FA.map(fcard).join('')}</div></div></section>`};
const tb=(head,rows,al)=>`<div class="tbl"><table><tr>${head.map((h,i)=>`<th class="${al[i]||''}">${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${al[i]||''}">${v}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cards=a=>`<div class="gg">${a.map(x=>`<div class="gcard"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`;
const ul=a=>`<ul class="bl">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const X={
  vampire:[['become','Becoming a Vampire',`<p>To become a vampire, you must be bitten by a vampire. After a bite there is a chance of receiving the <b>Sanguinare Vampiris</b> effect, which lasts about one Minecraft night cycle before the transformation is complete.</p><p>Once the bite takes effect, progression follows the Vampire path: level up through the faction system, manage blood exposure, and learn the weaknesses that matter in combat.</p>`],['levels','Vampire Levels 1–14',`<p>From Level 2 onward you must perform rituals at special altars, always at night. Levels 2–4 require the <b>Altar of Inspiration</b>, and from Level 5 you need the <b>Altar of Mastery</b> for higher-level progression.</p>${tb(['Level','Requirement','Notes'],[['1','Start as a vampire-infected player','Initial transformation state'],['2–4','Altar of Inspiration','Night-only progression'],['5–14','Higher altars and ritual progression','Unlock more power and stronger weaknesses']],['c','c',''])}`],['abilities','Vampire Abilities',`<p>As your level rises you gain skill points that you can invest in an ability tree. Available options include:</p>${cards([['Night Vision & Blood Vision','See clearly in darkness and track targets through blood-based vision.'],['Blood Control','Manage blood use, healing, and combat efficiency.'],['Movement & Speed','Improve mobility when using your vampire form.'],['Weakness Mitigation','Reduce the penalties from sunlight, water, or other environmental hazards.']])}`],['weak','Weaknesses',`<p>Vampires are sensitive to sunlight; how strongly this disadvantage applies changes with level and age. Water additionally weakens untrained vampires, but this can be offset by proper progression and ability choices.</p>${ul(['Sunlight penalties become more important as the vampire ages.','Water damage or weakness can affect unprepared vampires.','Skill investment and faction progression can reduce or manage these penalties.'])}`],['lords','Vampire Lords',`<p>Once you reach Level 14, you can take on the Lord progression with a Vampire Representative. As a Lord you can bind vampire NPCs to yourself as minions and equip them.</p>`],['ages','Ages',`<p>Over time, vampires can reach different Ages that change their abilities, strengths, and weaknesses. You learn the exact details of each Age in-game through books and NPCs.</p><p><b>Important:</b> age, level, and progression are all important; do not assume all vampires behave identically.</p>`]],
  hunter:[['become','Becoming a Hunter',`<p>Find a village with a Vampire Hunter Trainer. Behind his house you will find garlic plants, from which you craft a <b>Garlic Injection</b>. Sit on the special chair in the hunter structure to begin the transformation and progression path.</p>`],['levels','Hunter Levels 1–14',`<p>You reach Levels 2–4 by collecting <b>Vampire Blood</b> (dropped when you kill regular vampire NPCs with a stake). From Level 5 you must first research at the <b>Research Table</b> before continuing.</p>${tb(['Level','How to progress','Key note'],[['2–4','Collect vampire blood and use the progression structure','Blood is the main resource'],['5+','Research and keep upgrading your hunter kit','Build focus around equipment and preparation']],['c','c',''])}`],['equip','Equipment',`${cards([['Weapon Table','Allows you to craft advanced weapons, including several crossbow variants. Some recipes require lava in the table.'],['Blood Potion Table','Brew special blood-based consumables for combat and support.'],['Research System','Unlocks better gear and more advanced hunter abilities.']])}`],['lords','Hunter Lords & Lord Levels 1–5',`<p>At Level 14 you can take on the Lord progression with a Hunter Representative. As a Lord you recruit and equip Hunter NPCs as minions.</p>${tb(['Lord level','Focus','Progression'],[['1','Recruitment','Basic minion support'],['2–3','Improved support and management','More durable and efficient troops'],['4–5','Enhanced lord progression','Strong leadership and war-ready support']],['c','c',''])}`],['dhampir','Tainted Blood & the Dhampir Path',`<p>From Hunter Lord Level 5, hunters can embark on an aging or corruption path. They learn to craft and use <b>Tainted Blood</b>, which drives the hunter toward a darker, more cursed route.</p>`]],
  werewolf:[['become','Becoming a Werewolf',`<p>When you fight werewolves, you can be bitten and receive the <b>Lupus Sanguinem</b> effect with unlimited duration. Alternatively, you receive the effect by interacting with a special werewolf-related activation mechanic in the world.</p>`],['levels','Werewolf Levels 1–14',`<p>To level up, place a <b>Stone Altar</b> with four <b>Stone Altar Fire Bowls</b> within 3 blocks and light them with a torch or lighter. Then put Liver and Crackers into the altar to complete the ritual.</p>${tb(['Stage','How it works','Goal'],[['1–4','Basic altar-based progression','Unlock early forms and stat boosts'],['5–14','Progress through stronger forms and rituals','Become a fully developed werewolf']],['c','c',''])}`],['forms','Werewolf Forms',`${cards([['Partial Turn','The simplest form: adds claws, ears, and light attribute bonuses. Can be used for an unlimited time.'],['Beast Form','Built for combat: more damage, better mobility, and harder-hitting attacks.'],['Specialized Transformations','Advanced forms vary based on build, race, and progression path.']])}`],['lords','Werewolf Lords & Lord Levels 1–5',`<p>From Level 14 you can accept the task <b>“Are you worthy?”</b> from the Werewolf Representative to become a Lord. As a Lord you found your own tribe and unlock stronger leadership mechanics.</p>`],['abilities','Abilities',`${cards([['Rage & Beast Form','Increased damage, bite damage, and running speed in combat mode.'],['Bleeding & Stun Bite','Bites cause bleeding over time or briefly paralyze enemies.'],['Movement & Survival','Improved mobility and trait bonuses for aggressive play.']])}`],['weak','Weaknesses',`<p>Werewolves are sensitive to silver. Without a suitable ability, they also suffer a weakness debuff underwater. Certain transformations are noticeably weaker during the day than at night.</p>`]],
  mage:[['system','The Mage System',`<p>The Mage is not a copy of the other faction progressions but a standalone VML system. Mages gather experience and resources to expand their magical abilities.</p>`],['levels','Mage Levels',`<p>As your Mage level rises, you unlock new abilities and upgrades. Progress depends on collecting and spending Magic Points.</p>`],['points','Magic Points',`<p>Magic Points are the central resource of the Mage system. You earn them by playing as a Mage and invest them in your magical development.</p>`],['tree','Skill Tree',`<p>The Mage Skill Tree lets you expand your abilities in a specific direction, depending on the playstyle you prefer.</p>`],['spells','Spells & Abilities',`<p>The playable magic on VML is based on several magic systems with different focuses, from combat spells to rituals and summoning. Which spells you can actually use depends on your progression and the server's mod setup.</p>`]]
};
FA.forEach(f=>P['faction-'+f.id]={t:f.name+' (faction)',h:()=>ph(ART[f.id],`Factions / ${f.name}`,f.name,f.intro,'Back to Factions','factions','f '+f.c)+`<section class="blk"><div class="wrap"><div class="fg"><div>${X[f.id].map(([k,tt,html])=>`<div id="${k}"><h2>${tt}</h2>${html}</div>`).join('')}</div><aside class="box" style="--c:${f.c==='vamp'?'var(--vamp)':f.c==='wolf'?'var(--wolf)':f.c==='hunt'?'var(--hunt)':'var(--mage)'}"><h3>Faction overview</h3><p>${f.intro}</p><ul class="bl"><li>${f.st}</li></ul></aside></div></div></section>`});
const CR=[['Vampirism · maxanier & contributors','Vampirism — Become a Vampire!','The foundation of our vampire gameplay. We are grateful to the Vampirism team and community.',[['Official site','https://vampirism-mod.com']]],['Werewolves · Cheaterpaul','Werewolves — Become a Beast!','A major part of our faction system. Special thanks to Cheaterpaul and everyone contributing to the project.',[['Official project','https://www.curseforge.com/minecraft/mc-mods/werewolves']]],['Vampirism Integrations · maxanier & contributors','Vampirism Integrations','Used by VML to connect Vampirism with other mods and provide additional compatibility.',[['Official project','https://www.curseforge.com/minecraft/mc-mods/vampirism-integrations']]],['Iron’s Spells ’n Spellbooks · Iron431 & team','Iron’s Spells ’n Spellbooks','A core part of the magical side of Vampire’s Magic Live.',[['Official project','https://www.curseforge.com/minecraft/mc-mods/irons-spells-n-spellbooks']]]];
const CR2=[['Xaero96','Xaero’s Minimap','Used as part of the VML modpack. All rights remain with the original creator.',[['Project','https://www.curseforge.com/minecraft/mc-mods/xaeros-minimap']]]];
const crc=a=>`<div class="gg cr">${a.map(c=>`<article class="gcard"><div class="own">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><div class="lk">${c[3].map(l=>`<a class="btn s" href="${l[1]}" target="_blank" rel="noreferrer">${l[0]}</a>`).join('')}</div></article>`).join('')}</div>`;
P.credits={t:'Credits & Licensing',h:()=>ph('vamp','Credits & Licensing','Blood, Magic & Acknowledgements','Vampire’s Magic Live (VML) is an independent Minecraft server and modpack project. We use many community-made mods and systems, and their original authors deserve proper credit.')+`<section class="blk"><div class="wrap"><div class="gg">${crc(CR)}${crc(CR2)}</div></div></section>`};
P['clan-wars']={t:'Clan Wars',h:()=>ph('war','Long-term survival','Clan Wars','A persistent world where territory, cooperation, trade, and faction progression matter. Start with the two systems that power large-scale play: claims and clans.')+`<section class="blk"><div class="wrap"><div class="split"><div class="panel"><h3>Claims</h3><p>Use claims to protect land, structure bases, and manage who can build or access protected areas.</p>${go('claims','Open claims')}</div><div class="panel"><h3>Clans</h3><p>Clan systems enable group formation, structure sharing, and coordinated team play during wars or long-term survival.</p>${go('clans','Open clans')}</div></div></div></section>`};
P.claims={t:'Claims',h:()=>ph('war','Clan Wars / Claims','Claims','Protect land and manage permissions from your first gold-shovel claim to advanced trust management.','Back to Clan Wars','clan-wars')+`<section class="blk"><div class="wrap"><div class="article"><div><div class="panel"><h3>Claim basics</h3>${ol(['Place a claim to secure a safe area.','Use trust rules to decide who can build, break blocks, and manage access.','Make sure your claim layout matches your faction and base design.'])}</div><div class="panel" style="margin-top:18px"><h3>Useful claim commands</h3>${CMDS.map(([c,e])=>cmd(c,e,'')).join('')}</div></div><aside class="aside"><h3>Claim checklist</h3><p>Claims are useful for protection, but they also require active management.</p><ul class="bl"><li>Keep your claim near your base or active area.</li><li>Use trust control carefully to avoid abuse.</li><li>Make sure your planning matches the risks of war or invasion.</li></ul></aside></div></div></section>`};
P.clans={t:'Clans',h:()=>ph('war','Clan Wars / Clans','Clans','Build a group for Clan Wars, then decide whether your team wants to apply for recognition as an Official Clan.','Back to Clan Wars','clan-wars')+`<section class="blk"><div class="wrap"><div class="article"><div><div class="panel"><h3>Clan structure</h3>${ol(['Create a clan with a clear purpose and a stable member list.','Use invitations and community trust to keep the clan organized.','Coordinate with the faction system and group goals in long-term play.'])}</div><div class="panel" style="margin-top:18px"><h3>Leader and member commands</h3>${CLANC.map(([c,e])=>cmd(c,e,'')).join('')}</div></div><aside class="aside"><h3>Good clan habits</h3><ul class="bl"><li>Keep roles and leadership clear.</li><li>Set acceptance screening to avoid toxic membership.</li><li>Use Discord and wiki information to coordinate with larger groups.</li></ul></aside></div></div></section>`};
P.creator={t:'Creator Program',h:()=>ph('mini','Community program','Creator Program','Current VML Creator requirements and the Discord ticket process. Older server materials may show different thresholds or rules.','Back to Clan Wars','clan-wars')+`<section class="blk"><div class="wrap"><div class="panel"><h3>Creator access</h3><p>Creators are granted based on the current VML requirements and staff review. If you are interested, open a ticket in the official Discord and provide examples of your work or the project you want to support.</p><ul class="bl"><li>Reference the current server rules and creator requirements.</li><li>Be prepared to wait for review.</li><li>Use Discord rather than in-game commands to ask about the process.</li></ul></div></div></section>`};
P.minigames={t:'Minigames',h:()=>ph('mini','Direct competition','Minigames','Minigames are a separate environment from Clan Wars. Do not assume currencies, progression, shops, or items transfer.')+`<section class="blk"><div class="wrap"><div class="panel"><h3>Minigame guidance</h3><p>Minigames usually work like a separate competitive layer. Check the current Discord or game announcements for exact event rules, rewards, and participation details.</p>${ol(['Treat minigames as a separate mode from survival and Clan Wars.','Do not assume battle rewards transfer to your main world progress.','Use them to practice mechanics, challenge other players, and build reputation.'])}</div></div></section>`};
P.rules={t:'Rules',h:()=>ph('vamp','The VML standard','Official Server Rules','Welcome to our server! By joining, you accept these rules.')+`<section class="blk"><div class="wrap" style="max-width:860px"><div class="rule"><div class="n">01</div><div><h2>Respect & conduct</h2><p>Respect all players and staff. Harassment, racism, sexism, bullying, spam, or targeted abuse will not be tolerated.</p></div></div><div class="rule"><div class="n">02</div><div><h2>Fair play</h2><p>Cheating, hacks, X-Ray, duping, exploiting glitches, or abusing unintended mechanics is prohibited.</p></div></div><div class="rule"><div class="n">03</div><div><h2>Faction integrity</h2><p>Use faction progression honestly and do not grief or sabotage other players in ways that violate server norms.</p></div></div><div class="rule"><div class="n">04</div><div><h2>Claims & clans</h2><p>Claims and clans are meant to support cooperative play, not to harass or disrupt other communities.</p></div></div><div class="rule"><div class="n">05</div><div><h2>Staff decisions</h2><p>Staff directions and moderation decisions are final. Disrespecting staff or escalating conflicts in the wrong way will be punished.</p></div></div></div></section>`};
const NAV=[['home','Home'],['join','Getting Started'],['factions','Factions'],['clan-wars','Clan Wars'],['minigames','Minigames'],['rules','Rules'],['credits','Credits']];
const PARENT={claims:'clan-wars',clans:'clan-wars',creator:'clan-wars'};
const app=document.getElementById('app'),nav=document.getElementById('nav');
nav.innerHTML=NAV.map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join('');
const strip=h=>h.replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/g,' ').replace(/\s+/g,' ');
const IDX=Object.keys(P).map(k=>({k,t:P[k].t,x:strip(P[k].h())}));
function show(id){if(!P[id])id='home';app.innerHTML=P[id].h();const act=id.startsWith('faction-')?'factions':PARENT[id]||id;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===act));nav.classList.remove('open');document.title=(id==='home'?'':' '+P[id].t+' | ')+'Vampire\'s Magic Live Wiki';window.scrollTo({top:0,behavior:'smooth'});} 
function navTo(id){location.hash=id}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();document.getElementById('search').classList.remove('open');navTo(g.dataset.go);return}const sc=e.target.closest('[data-sc]');if(sc){const el=document.getElementById(sc.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}const c=e.target.closest('[data-copy]');if(c){const t=c.dataset.copy,d=()=>{c.textContent='Copied';setTimeout(()=>c.textContent='Copy command',1300)};if(navigator.clipboard)navigator.clipboard.writeText(t).then(d,d);else d()}});
document.getElementById('bg').onclick=()=>nav.classList.toggle('open');
const S=document.getElementById('search'),Q=document.getElementById('q'),R=document.getElementById('res');
document.getElementById('sb').onclick=()=>{S.classList.toggle('open');if(S.classList.contains('open'))Q.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')S.classList.remove('open')});
Q.oninput=()=>{const q=Q.value.trim().toLowerCase();if(!q){R.innerHTML='';return}const hits=IDX.map(p=>{const i=p.x.toLowerCase().indexOf(q),ti=p.t.toLowerCase().includes(q);return(i>=0||ti)?{p,i,s:ti?0:1}:null}).filter(Boolean).sort((a,b)=>a.s-b.s);R.innerHTML=hits.length?hits.map(h=>{const x=h.p.x,i=Math.max(0,h.i-40);return`<button data-go="${h.p.k}"><b>${h.p.t}</b><span>${h.i>=0?esc((i>0?'…':'')+x.slice(i,i+120)+'…'):''}</span></button>`}).join(''):'<div class="panel"><p>No match found.</p></div>'};
show(location.hash.slice(1));
</script></body></html>
