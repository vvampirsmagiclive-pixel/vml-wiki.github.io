{id:'werewolf',name:'Werewolf',c:'wolf',icon:'&#9790;',intro:'A transformation-focused faction that trades human flexibility for feral forms and physical power.',st:'Distinct werewolf forms, transformation abilities, level 1–14 progression, and Lord goals.',we:'Transformation requirements and form limitations affect when and how you can use your power.',co:'Exploit the player’s current form and preparation; do not assume every ability is available at every level.',pr:'Infection and transformation follow the installed version; track materials and progression requirements as you advance.',d:['Become infected and transform according to the installed version. Track required materials and progression from Level 1 to Level 14.','Forms have different practical uses and limitations. Lord progression is a separate goal from simply becoming a Werewolf.','Preparation, transformation timing, and the current form affect counterplay. Confirm version-specific infection mechanics before relying on a guide.']},
{id:'hunter',name:'Hunter',c:'hunt',icon:'&#10022;',intro:'A disciplined anti-supernatural path based on research, equipment, and preparation rather than transformation.',st:'Specialized equipment, research stations, and tools designed to answer supernatural threats.',we:'Preparation and crafting matter; hunters do not receive the same innate transformation abilities as supernatural factions.',co:'Pressure an unprepared hunter before their equipment and research are ready.',pr:'Advance from level 1 to 14 through hunter research, crafting, and the Lord path.',d:['Become a Hunter and advance through Level 1 to Level 14 using equipment, research, and relevant crafting stations.','Hunter tools support an anti-supernatural role. Hunter corruption, Tainted Blood, and the Dhampir path are related progression concepts, not interchangeable promises.','Equipment and research create preparation costs; the path does not provide supernatural transformation abilities.']},
{id:'mage',name:'Mage',c:'mage',icon:'&#10023;',intro:'A custom VML progression path for players who want to combine Magic Points, a Skill Tree, and spellcraft.',st:'Flexible spell-based play, unlockable abilities, and build choices through the custom Skill Tree.',we:'Power depends on progression, resources, prerequisites, and choosing a focused build.',co:'Disrupt preparation and resource access; do not confuse Ars Nouveau or Iron’s Spells features with VML progression.',pr:'Earn Magic Points, unlock Skill Tree nodes, then improve abilities and spells where requirements allow.',d:['Become a Mage through the custom VML Mage system. Magic Points fuel progression and the Skill Tree determines unlocks and upgrades.','Separate the custom VML system from generic Ars Nouveau and Iron’s Spells features: a spell feature is not automatically a VML level reward.','Unlock abilities only when the current prerequisites are met. A focused build and resource planning matter more than a universal best path.']}];
const ART={vampire:'vamp',werewolf:'wolf',hunter:'hunt',mage:'mage'};

const RULES=[['General Conduct','Tone: Respectful behavior is mandatory. Racism, sexism, bullying, spam, or excessive insults will lead to an immediate ban.','Fair Play: Cheating, hacks, X-Ray, multi-accounts, or exploiting game bugs are strictly prohibited.'],['Spawn Protection & Wilderness','The 4 Spawn Sites: These are neutral safe zones. PvP, griefing (breaking/destroying), and camping are strictly prohibited here.','Wilderness & Griefing: Every player is responsible for their own property. Anything not protected by a claim is considered wilderness. Griefing, mining, and stealing are explicitly allowed here.'],['Claims & Property Rights','Your Claim is Your Home: A claim protects your property. Others may not build or open containers there without permission.','House Rights: If a player enters your claim and refuses to leave after being asked, you have the right to evict them by any means necessary.','Baiting Ban: Deliberately luring players into your claim to kill them (trapping) is prohibited.'],['PvP & Teleportation','Fair Combat: TP-trapping (luring players to death via teleport) and combat-logging (disconnecting during a fight) are strictly prohibited.'],['Vampires, Werewolves & Magic','Vampirism/Lycanthropy — Consent Rule: Biting, draining blood, or infecting players without their explicit consent is prohibited.','No Stalking: Stalking or camping players to force them to transform is prohibited.',"Magic (Ars Nouveau / Iron's Spells) — No Terraforming: Spells that permanently alter the environment are prohibited outside of your own claim.",'Performance: Automations must be limited to ensure they do not negatively impact server performance.'],['Clans & Creator Program','Clans: Everyone can start a clan using /clan create.','Official Clans: These clans represent the server.','Requirements: At least 10 active members and at least one member with the [Creator] rank.','Privileges: Project support, in-game tags, and representation rights.','Responsibility: Official Clan members serve as role models. Rule violations are sanctioned twice as severely as for regular players.','Creator Rank Requirements: YouTube channel with at least 100 subscribers. Creation of regular content (multiple videos per month) about our server. The rank is granted after review and will be revoked if content creation stops.'],['Consequences','The admin team has the final say.','Violations are punished with warnings, jail, temporary or permanent bans depending on severity.','When in doubt: Ask before you act!']];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ext=(t,u)=>`<a class="btn p" href="${u}" target="_blank" rel="noreferrer">${t} &#8599;</a>`;
const go=(id,t)=>`<button class="btn s" data-go="${id}">${t}</button>`;
const ph=(k,tag,title,text,back,bk,cls='')=>`<div class="ph ${cls}"><div class="bgart">${art(k,title.length)}</div><div class="in">${back?`<button class="crumb" data-go="${bk}">&larr; ${back}</button><br>`:''}<span class="tag">${tag}</span><h1>${title}</h1><p>${text}</p></div></div>`;
const cmd=(c,e,x)=>`<div class="cmd"><div class="t"><code>${esc(c)}</code><button class="cp" data-copy="${esc(c)}">Copy command</button></div><p>${esc(e)}</p>${x?`<small>Example: <code>${esc(x)}</code></small>`:''}</div>`;
const ol=a=>`<ol class="nl">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;
const fcard=f=>`<button class="fc ${f.c}" data-go="faction-${f.id}"><div class="art">${art(ART[f.id],f.id)}</div><div class="bd"><h3>${f.name}</h3><p>${f.intro}</p><p style="color:var(--tx)">${f.st}</p><span class="go">Explore ${f.name} &rarr;</span></div></button>`;
const P={};
P.home={t:'Home',h:()=>`<div class="hero"><div class="bgart">${art('home',1)}</div><div class="in"><span class="tag">The official wiki &middot; Minecraft 1.20.1</span><h1>Enter the <span>Nightbound</span> world</h1><p>Vampire's Magic Live is a modded Minecraft experience where supernatural factions, magic, survival, and competitive play meet.</p><div class="row">${go('join','How to join').replace('btn s','btn p')}${ext('Open official Discord',DC).replace('btn p','btn s')}</div><p class="note">Artwork on this wiki is stylised illustration, not in-game screenshots.</p></div></div>
<section class="blk"><div class="wrap"><h2 style="margin-top:0">Four factions. One world to shape.</h2><p class="lead">Understand strengths, weaknesses, counters, and progression before you choose your place in Clan Wars.</p><div class="fgrid" style="margin-top:1.6rem">${FA.map(fcard).join('')}</div><div class="row">${go('factions','Compare factions')}</div></div></section>
<section class="blk" style="padding-top:0"><div class="wrap"><h2 style="margin-top:0">Survive. Compete. Leave a mark.</h2><div class="split" style="margin-top:1.4rem"><button class="pc" data-go="clan-wars"><div class="bgart">${art('war',7)}</div><div class="tx"><h3>Clan Wars</h3><p>Claims, clans, cities, economy, and long-term faction progression.</p><b style="color:var(--lav);font-size:.9rem">Open overview &rarr;</b></div></button><button class="pc" data-go="minigames"><div class="bgart">${art('mini',9)}</div><div class="tx"><h3>Minigames</h3><p>Direct competition through FFA, duels, Hunger Games, and faction-themed kits.</p><b style="color:var(--lav);font-size:.9rem">Explore modes &rarr;</b></div></button></div></div></section>`};
P.join={t:'Getting Started',h:()=>ph('home','Begin your journey','Getting Started','Prepare for VML without guessing at details the project has not published.')+`<section class="blk"><div class="wrap" style="max-width:820px">${[['Get the modpack','Download the official VML modpack from CurseForge.'],['Choose a path','Read the faction guides before committing to a progression style.'],['Join Discord','Announcements, support, and tickets live in the official community.'],['Enter the world','Follow the current connection information shared by the VML team.']].map((x,i)=>`<div class="step"><span class="n">${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}<div class="row">${ext('Open CurseForge',CF)}${ext('Join Discord',DC).replace('btn p','btn s')}</div></div></section>`};
P.factions={t:'Factions',h:()=>ph('home','Find your alignment','The Four Factions','Compare the actual playstyle, strengths, vulnerabilities, and progression considerations of each path.')+`<section class="blk"><div class="wrap"><div class="fgrid">${FA.map(fcard).join('')}</div><h2>At a glance</h2><div class="tbl"><table><tr><th>Faction</th><th>Strengths</th><th>Weaknesses</th><th>Playstyle</th></tr>${FA.map(f=>`<tr><td style="color:var(--${f.c==='vamp'?'vamp':f.c==='wolf'?'wolf':f.c==='hunt'?'hunt':'mage'})">${f.name}</td><td>${f.st}</td><td>${f.we}</td><td>${f.intro}</td></tr>`).join('')}</table></div></div></section>`};
const tb=(head,rows,al)=>`<div class="tbl"><table><tr>${head.map((h,i)=>`<th class="${al[i]||''}">${h}</th>`).join('')}</tr>${rows.map(r=>r.length===2?`<tr><td class="c"><span class="lv">${r[0]}</span></td><td colspan="${head.length-1}">${r[1]}</td></tr>`:`<tr>${r.map((c,i)=>`<td class="${al[i]||''}">${i===0&&al[0]==='c'?`<span class="lv">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const cards=a=>`<div class="gg">${a.map(x=>`<div class="gcard"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`;
const ul=a=>`<ul class="bl">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const note=t=>`<p class="note" style="max-width:none">${t}</p>`;
const X={
vampire:[
['become','Becoming a Vampire',`<p>To become a vampire, you must be bitten by a vampire. After a bite there is a chance of receiving the <b>Sanguinare Vampiris</b> effect, which lasts about one Minecraft day. When the effect runs out, you become a vampire. Alternatively, right-click with <b>Vampire Fangs</b> in your hand to inject yourself with blood and trigger the same effect.</p><p>If you want to get rid of the effect, you can cancel it with a bucket of milk.</p><p>A freshly turned vampire (Level 1) is already faster, stronger, and tougher than a human, but sunlight does not seriously harm you at this stage yet.</p>`],
['levels','Vampire Levels 1–14',`<p>From Level 2 onward you must perform rituals at special altars, always at night. Levels 2–4 require the <b>Altar of Inspiration</b>; from Level 5 you need the larger, multi-block <b>Altar of Infusion</b>.</p><h3>Altar of Inspiration (Levels 2–4)</h3><p>Fill the altar with blood bottles (right-click). Once it contains enough blood, infuse it into yourself by sneak-right-clicking with an empty hand.</p><h3>Altar of Infusion (Levels 5–14)</h3><p>This altar needs a multi-block structure: the main block (Altar of Infusion), surrounded by Altar Pillars with an Altar Tip on top. Each pillar must be filled consistently with the same material (maximum height: 3 blocks). Materials provide different “Structure Points”: cobblestone counts 1 point, an iron block 2 points, and a gold block 3 points. Once there are enough Structure Points and the required items are in the altar, a sneak-right-click starts the ritual.</p>${tb(['Level','Altar / requirement','Structure Points','Pure Blood','Human Heart'],[['1','Transformation (bite or Vampire Fangs)','—','—','—'],['2','Altar of Inspiration — 40 blood','—','—','—'],['3','Altar of Inspiration — 70 blood','—','—','—'],['4','Altar of Inspiration — 100 blood','—','—','—'],['5','Altar of Infusion','8','0','5'],['6','Altar of Infusion','17','1 (Purity 1)','5'],['7','Altar of Infusion','17','1 (Purity 1)','10'],['8','Altar of Infusion','26','1 (Purity 2)','10'],['9','Altar of Infusion','26','1 (Purity 2)','10'],['10','Altar of Infusion','35','1 (Purity 3)','15'],['11','Altar of Infusion','35','1 (Purity 3)','15'],['12','Altar of Infusion','44','1 (Purity 4)','20'],['13','Altar of Infusion','44','2 (Purity 4)','20'],['14','Altar of Infusion — maximum level','54','2 (Purity 5)','25']],['c','l','c','c','c'])}${note('Values may change with balancing adjustments. At Level 14 the regular progression is complete; the Vampire Lord progression follows.')}`],
['abilities','Vampire Abilities',`<p>As your level rises you gain skill points that you can invest in an ability tree. Available options include:</p>${cards([['Night Vision & Blood Vision','See clearly in the dark, or detect creatures even through walls.'],['Bat Transformation','Turn into a bat and fly away.'],['Blood Frenzy','In rage mode you become faster and hit harder, at the cost of higher blood consumption.'],['Defense','Abilities such as invisibility, camouflage, bat swarms, or a damage limiter protect you from danger.'],['Blood Projectile & Finisher','Fire blood projectiles, or finish off weak enemies with a targeted finisher strike.'],['Tougher Blood','Reduce your blood thirst or become more resistant to direct sun damage.']])}`],
['weak','Weaknesses',`<p>Vampires are sensitive to sunlight; how strongly this disadvantage applies changes with level and age. Water additionally weakens untrained vampires, but this can be offset by a suitable ability.</p>`],
['lords','Vampire Lords',`<p>Once you reach Level 14, you can take on the Lord progression with a Vampire Representative. As a Lord you can bind vampire NPCs to yourself as minions and equip them.</p>${tb(['Lord level','Title'],[['1','Baron / Baroness'],['2','Viscount / Viscountess'],['3','Count / Countess'],['4','Duke / Duchess'],['5','Prince / Princess']],['c','l'])}<p>To become a Lord or to rise as one, you must complete special tasks for a Village Representative of your faction. The exact assignment is given to you personally by the respective Representative.</p>${note('The title’s gender defaults to your skin type but can be customized individually.')}`],
['ages','Ages',`<p>Over time, vampires can reach different Ages that change their abilities, strengths, and weaknesses. You learn the exact details of each Age in-game through books and NPCs.</p><p><b>Age 5:</b> A vampire of this stage is extremely resilient and takes hardly any regular damage. Piercing weapons, as well as fire and fire magic, remain the truly effective answers.</p>`]],
hunter:[
['become','Becoming a Hunter',`<p>Find a village with a Vampire Hunter Trainer. Behind his house you will find garlic plants, from which you craft a <b>Garlic Injection</b>. Sit on the special chair in the trainer’s house and inject the vaccine. This makes you immune to the poisonous bite of vampires (Sanguinare Vampiris).</p>`],
['levels','Hunter Levels 1–14',`<p>You reach Levels 2–4 by collecting <b>Vampire Blood</b> (dropped when you kill regular vampire NPCs with a stake). From Level 5 you must first research at the <b>Hunter Table</b>: examining certain items gives you Intel, which you then redeem for a fee with a Hunter Trainer in the village.</p><p>For higher Intel levels, the Hunter Table must be expanded with adjacent blocks: a Weapon Table, a Potion Table, and an Alchemical Cauldron. The highest level requires all three.</p>${tb(['Level','Requirement','Pure Blood','Vampire Fangs'],[['1','Garlic Injection from the Hunter Trainer','—','—'],['2','4 Vampire Blood','—','—'],['3','8 Vampire Blood','—','—'],['4','12 Vampire Blood','—','—'],['5','Research + training','0','5'],['6','Research + training','1 (Purity 1)','0'],['7','Research + training','1 (Purity 1)','5'],['8','Research + training','1 (Purity 2)','0'],['9','Research + training','1 (Purity 2)','5'],['10','Research + training','1 (Purity 3)','5'],['11','Research + training','1 (Purity 3)','10'],['12','Research + training','1 (Purity 4)','10'],['13','Research + training','2 (Purity 4)','0'],['14','Research + training — maximum level','2 (Purity 5)','0']],['c','l','c','c'])}${note('Values may change with balancing adjustments. At Level 14 the regular progression is complete; the Hunter Lord progression follows.')}`],
['equip','Equipment',`${cards([['Weapon Table','Allows you to craft advanced weapons, including several crossbow variants. Some recipes require lava in the table.'],['Blood Potion Table','Brew special potions and strengthen their effects further.'],['Stakes','Instant-kill weapons against vampires below a certain health threshold.']])}${note('You can look up all concrete recipes at any time in the in-game recipe book.')}`],
['lords','Hunter Lords & Lord Levels 1–5',`<p>At Level 14 you can take on the Lord progression with a Hunter Representative. As a Lord you recruit and equip Hunter NPCs as minions.</p>${tb(['Lord level','Title'],[['1','Lieutenant'],['2','Captain'],['3','Major'],['4','Colonel'],['5','Brigadier']],['c','l'])}<p>The tasks for Lord advancement are given to you personally by a Village Representative.</p>`],
['dhampir','Tainted Blood & the Dhampir Path',`<p>From Hunter Lord Level 5, hunters can embark on an aging or corruption path. They learn to craft and use <b>Tainted Blood</b>, which drives the hunter increasingly toward corruption.</p><p>Further along, a hunter can transform into a <b>Dhampir</b> (half-vampire). This makes them stronger and grants some vampiric traits, but also vampire-typical weaknesses, such as increased sensitivity to sunlight.</p><p>You can find the exact Tainted Blood recipes in the in-game recipe book. Books and NPCs in-game provide detailed explanations of the aging path.</p>`]],
werewolf:[
['become','Becoming a Werewolf',`<p>When you fight werewolves, you can be bitten and receive the <b>Lupus Sanguinem</b> effect with unlimited duration. Alternatively, you receive the effect by interacting with a <b>Werewolf Tooth</b> in your hand. Milk removes the effect again. To complete the transformation, you must sleep and wake up again; afterward you are Werewolf Level 1.</p>`],
['levels','Werewolf Levels 1–14',`<p>To level up, place a <b>Stone Altar</b> with four <b>Stone Altar Fire Bowls</b> within 3 blocks and light them with a torch or lighter. Then put Liver and Cracked Bones into the altar and start the ritual with a right-click using a lighter or a (soul) torch.</p>${tb(['Level','Liver','Cracked Bones','Damage dealt'],[['1','Transformation (bite, or Werewolf Tooth + sleeping)'],['2','3','2','250'],['3','4','3','370'],['4','5','4','500'],['5','6','5','625'],['6','7','6','750'],['7','8','7','875'],['8','9','8','1000'],['9','10','9','1125'],['10','11','10','1255'],['11','12','11','1375'],['12','13','12','1500'],['13','14','13','1625'],['14','15','14','1750']],['c','c','c','c'])}${note('“Damage dealt” is the sum of the maximum health of all creatures you have killed; progress is shown in the Vampirism menu. Cracked Bones drop from werewolves and skeletons; Liver drops from werewolves and villagers.')}`],
['forms','Werewolf Forms',`${cards([['Partial Turn','The simplest form: adds claws, ears, and light attribute bonuses. Can be used for an unlimited time.'],['Beast Form','Built for combat: more damage and resistance.'],['Survival Form','Built for speed: significantly higher movement speed.']])}${note('The transformation unfolds its full power at night; during the day the form is weaker and its duration is limited.')}`],
['lords','Werewolf Lords & Lord Levels 1–5',`<p>From Level 14 you can accept the task <b>“Are you worthy?”</b> from the Werewolf Representative to become a Lord. As a Lord you found your own tribe and can recruit werewolves as minions.</p><div class="prog">${[['Become a Lord — “Are you worthy?”',['Kill 10 Hunters','Kill 10 Vampires','Own 2 Werewolf Teeth','Own 32 Gold Ingots','Win 3 Village Raids (attack or defense)']],['Lord Level 2 — “The next step”',['Own 2 Werewolf Teeth','Own 32 Gold Ingots','Kill 20 Hunters','Kill 20 Vampires']],['Lord Level 3 — “One More”',['Own 3 Werewolf Teeth','Own 32 Gold Ingots','Kill 20 Hunters','Kill 20 Vampires']],['Lord Level 4 — “Control mania”',['Own 3 Werewolf Teeth','Own 64 Gold Ingots','Kill 35 Hunters','Kill 35 Vampires']],['Lord Level 5 — “Megalomania”',['Capture 6 enemy villages','Own 4 Werewolf Teeth','Own 64 Gold Ingots','Kill 50 Hunters','Kill 50 Vampires']]].map(q=>`<div class="pcard"><h3 style="font-size:1rem;margin-bottom:.7rem">${q[0]}</h3>${ul(q[1])}</div>`).join('')}</div><h3 style="margin-top:1.6rem">Minions</h3><p>To recruit minions, you offer a <b>Moon Charm</b> to a werewolf. How many followers you can keep at once depends on your Lord level. You obtain the Moon Charm through the task <b>“Minion Control”</b> (kill 4 Advanced Hunters, kill 6 Advanced Vampires, own 32 Gold Ingots).</p><p>Minions have the attributes inventory space, health, strength, and resource efficiency, which can be increased further with Moon Charm upgrades — available through additional tasks from the Werewolf Representative.</p>`],
['abilities','Abilities',`${cards([['Rage & Beast Form','Increased damage, bite damage, and running speed in combat mode.'],['Bleeding & Stun Bite','Bites cause bleeding over time or briefly paralyze the opponent.'],['Howling & Wolf Pack','Increases the attack speed of nearby werewolves or summons wolves for support.'],['Sense & Sixth Sense','Detect nearby creatures through walls or get warned before attacks.']])}`],
['weak','Weaknesses',`<p>Werewolves are sensitive to silver. Without a suitable ability, they also suffer a weakness debuff underwater. Certain transformations are noticeably weaker during the day than at night.</p>`]],
mage:[
['system','The Mage System',`<p>The Mage is not a copy of the other faction progressions but a standalone VML system. Mages gather experience and resources to expand their magical abilities.</p>`],
['levels','Mage Levels',`<p>As your Mage level rises, you unlock new abilities and upgrades. Progress depends on collecting and spending Magic Points.</p>`],
['points','Magic Points',`<p>Magic Points are the central resource of the Mage system. You earn them by playing as a Mage and invest them in your magical development.</p>`],
['tree','Skill Tree',`<p>The Mage Skill Tree lets you expand your abilities in a specific direction, depending on the playstyle you prefer.</p>`],
['spells','Spells & Abilities',`<p>The playable magic on VML is based on several magic systems with different focuses, from combat spells to rituals and summoning. Which spells you can actually use depends on your progress in the Skill Tree.</p>${note('Exact spell lists, recipes, and prices for Mage NPCs can be found in-game. This wiki deliberately describes only what you can do in principle.')}`]]};

const CR2=[['Xaero96','Xaero’s Minimap','Used as part of the VML modpack. All rights remain with its respective creator.',[['Project','https://www.curseforge.com/minecraft/mc-mods/xaeros-minimap']]],['Xaero96','Xaero’s World Map','Used as part of the VML modpack. All rights remain with its respective creator.',[['Project','https://www.curseforge.com/minecraft/mc-mods/xaeros-world-map']]]];
const crc=a=>`<div class="gg cr">${a.map(c=>`<article class="gcard"><div class="own">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><div class="lk">${c[3].map(l=>`<a class="btn s" href="${l[1]}" target="_blank" rel="noopener noreferrer">${l[0]} &#8599;</a>`).join('')}</div></article>`).join('')}</div>`;
P.credits={t:'Credits & Licensing',h:()=>ph('vamp','Credits & Licensing','Blood, Magic & Acknowledgements','Vampire’s Magic Live (VML) is an independent Minecraft server and modpack project. We use and appreciate many incredible community-made projects. This page gives credit to their creators and clearly separates their work from our own.')+`<section class="blk"><div class="wrap"><span class="tag">Not affiliated with any mod developer or official project</span><h2 style="margin-top:.6rem">A special thank you</h2><p>We would like to give special thanks to the developers behind the projects that form a major part of VML’s magic and faction gameplay.</p>${crc(CR)}<div class="panel" style="margin-top:22px"><span class="tag">Visuals · Complementary Development</span><h3>Complementary Shaders</h3><p style="margin:.5rem 0 1rem">VML uses Complementary Shaders for its visual presentation. We appreciate the work of Complementary Development and link directly to the official project.</p><div class="lk"><a class="btn s" href="https://www.complementary.dev/" target="_blank" rel="noopener noreferrer">complementary.dev &#8599;</a><a class="btn s" href="https://www.complementary.dev/shaders/" target="_blank" rel="noopener noreferrer">Shaders &#8599;</a></div></div><h2>More acknowledgements</h2>${crc(CR2)}<div class="call" style="margin-top:26px"><h3>Not on this list?</h3><p style="margin-top:.5rem">Nearly all mods in the VML modpack belong to third-party creators. The projects listed here are either core mods for VML, or their owners explicitly require that they are credited and linked. If you are a creator whose mod appears in our modpack but is not listed on this page, and you would like to be added, please get in touch with us and we will credit you and link your project where it is necessary.</p>${ext('Contact us on Discord',DC)}</div><div class="panel" style="margin-top:18px"><h3>Third-party content</h3><p style="margin:.4rem 0 0">Vampire’s Magic Live does not own, create, or claim ownership of third-party mods, shaders, code, assets, names, logos, or other content belonging to their respective creators. Their inclusion in VML does not imply endorsement or affiliation unless explicitly stated by the respective creator.</p></div><div class="panel own2" style="margin-top:18px"><h3>Our own work</h3><p style="margin:.4rem 0 0">The custom animations, FancyMenu implementations, configurations, and other original content created specifically for Vampire’s Magic Live are our own work. Please do not copy, redistribute, reuse, or include these custom creations in another project without our explicit permission.</p></div><h2>Independent project</h2><p>Vampire’s Magic Live is <b>not an official project</b> of Vampirism, Werewolves, Vampirism Integrations, Iron’s Spells ’n Spellbooks, Complementary Development, Xaero96, or any other mod developer. VML is an independent server and modpack project. While we were inspired in part by the presentation and spirit of Vampirism.co, we are not affiliated with or operated by Vampirism.co or its official server.</p><p class="note" style="max-width:none">Third-party trademarks, mods, shaders, and assets belong to their respective owners. This page is an acknowledgement and licensing notice, not a claim of ownership over third-party content. Minecraft is a trademark of Mojang Studios and is not affiliated with or endorsed by VML.</p></div></section>`};
P['clan-wars']={t:'Clan Wars',h:()=>ph('war','Long-term survival','Clan Wars','A persistent world where territory, cooperation, trade, and faction progression matter. Start with the two systems that protect your work and organize your people.')+`<section class="blk"><div class="wrap"><div class="gg"><button class="gcard" data-go="claims"><div class="crest">&#9960;</div><h3>Claims</h3><p>Protect land, manage permissions, and troubleshoot claim access.</p></button><button class="gcard" data-go="clans"><div class="crest">&#9876;</div><h3>Clans</h3><p>Create a clan, invite players, and learn the Official Clan path.</p></button><div class="gcard"><div class="crest">&#9733;</div><h3>Economy</h3><p>Understand coins, trading, and why economy systems are not interchangeable with Minigames.</p></div><div class="gcard"><div class="crest">&#9819;</div><h3>Cities & NPCs</h3><p>Use faction cities and NPCs as orientation points in the world.</p></div><div class="gcard"><div class="crest">&#9830;</div><h3>Trading & Player Shops</h3><p>Coordinate player shops and trading without making unsupported promises.</p></div></div><div class="call" style="margin-top:34px"><h2 style="margin-top:0">Claims and Clans are separate systems.</h2><p style="margin:0">A claim controls land permissions. A clan organizes players. You can use one without the other, and neither automatically grants the other's permissions.</p></div></div></section>`};
P.claims={t:'Claims',h:()=>ph('war','Clan Wars / Claims','Claims','Protect land and manage permissions from your first gold-shovel claim to advanced trust management.','Back to Clan Wars','clan-wars')+`<section class="blk"><div class="wrap article"><div><h2 style="margin-top:0">What claims protect</h2><p>A claim marks land as protected property. Building and container access depend on the permissions granted inside that claim. Claims do not replace server rules: baiting, TP-traps, and other prohibited conduct remain prohibited.</p><h2>Create a claim with a gold shovel</h2>${ol(['Obtain and hold a gold shovel.','Use it to select the first corner of the area.','Select the opposite corner to define the rectangle.','Recognize the displayed claim boundary and keep important builds inside it.'])}<div class="diag"><span>First corner</span><i>Protected claim area</i><span>Opposite corner</span></div><h2>Permission commands</h2>${CMDS.map(c=>cmd(...c)).join('')}<h2>Management and troubleshooting</h2><div class="gg">${[['Permission did not work','Stand inside the relevant claim, check <code>/trustlist</code>, and confirm you used the narrower access command your task requires.'],['Need to share storage only?','Prefer <code>/containertrust</code> instead of broad trust so the player does not receive more access than necessary.'],['Need to remove access?','Use <code>/untrust &lt;player&gt;</code>, then inspect the list again. If something remains unclear, ask staff in Discord.'],['Resizing or abandoning','Only use resize or abandon controls visibly supported by the installed claim system. This guide does not invent extra commands; verify the current in-game help before changing a valuable claim.']].map(x=>`<div class="gcard"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div><aside class="aside"><span class="tag">Quick rule</span><h3>Least privilege wins.</h3><p>Give the narrowest trust type that solves the problem. It is easier to expand access than to recover from an accidental broad permission.</p>${go('clan-wars','Back to Clan Wars')}</aside></div></section>`};
P.clans={t:'Clans',h:()=>ph('war','Clan Wars / Clans','Clans','Build a group for Clan Wars, then decide whether your team wants to apply for recognition as an Official Clan.','Back to Clan Wars','clan-wars')+`<section class="blk"><div class="wrap article"><div><h2 style="margin-top:0">Normal clans</h2><p>Normal clans organize players for shared activity. Many clan features can also be accessed through the clan GUI. Use the confirmed commands below and follow the in-game prompts for the installed version.</p>${CLANC.map(c=>cmd(c[0],c[1],'')).join('')}<h2>Official Clans</h2><p>An Official Clan is recognized by the VML team. Recognition is not automatic: meeting the visible requirements starts a review, it does not guarantee approval or rewards.</p><div class="tbl"><table><tr><th>Topic</th><th>Normal Clan</th><th>Official Clan</th></tr>${[['Creating','Confirmed normal creation process.','Normal creation plus review application.'],['Membership','Normal clan membership.','At least 10 active members.'],['Creator involvement','No official status required.','At least one qualifying [Creator].'],['Recognition','No official recognition unless granted.','Recognized by the VML team.'],['Benefits','Normal available features.','Cooperation and project support may be available when approved; extra claim blocks are not guaranteed.'],['Responsibility','Standard server rules.','Represents VML within approved scope; violations are sanctioned twice as severely.']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><h2>How to apply</h2>${ol(['Build a clan with at least 10 active members.','Ensure the current Creator requirement is met.','Open a ticket in the official VML Discord.','Provide your clan, member, Creator, and project information.','Wait for the VML team to review it.','Remember that requirements do not create automatic approval.'])}<div class="row">${ext('Apply for Official Clan',DC)}${go('creator','How to Become a Creator')}</div></div><aside class="aside"><span class="tag">Creator Program</span><h3>Creator status supports official projects.</h3><p>The current program starts at 100 YouTube subscribers plus regular VML content. Subscriber count alone does not guarantee approval.</p>${go('creator','How to Become a Creator')}</aside></div></section>`};
P.creator={t:'Creator Program',h:()=>ph('mini','Community program','Creator Program','Current VML Creator requirements and the Discord ticket process. Older server materials may show different thresholds; this page follows the current specification.','Back to Clans','clans')+`<section class="blk"><div class="wrap"><div class="prog"><div class="pcard vamp"><span class="badge">100+ subscribers</span><h3>Creator</h3><p style="margin-top:.6rem">At least 100 YouTube subscribers, multiple videos per month about VML, regular activity, and review by the VML team. The rank may be revoked if content creation stops.</p><h3 style="font-size:1rem">Apply</h3>${ol(['Review eligibility and prepare channel information.','Join the official Discord and open a ticket.','Share your channel and relevant video links.','Wait for the team to review the application.'])}</div><div class="pcard" style="--c:var(--acc)"><span class="badge">200+ subscribers</span><h3>Creator+</h3><p style="margin-top:.6rem">At least 200 YouTube subscribers, regular VML content, active server promotion, and regular activity and cooperation as required by the current program.</p><p>Cooperation with marketing, content ideas, thumbnails, reach, monetization-related guidance, and larger projects may be offered where actually available. No growth, income, or result is guaranteed.</p></div><div class="pcard wolf"><span class="badge">25,000+ subscribers</span><h3>VIP</h3><p style="margin-top:.6rem">VIP is honorary and cannot be requested through the normal Creator application. Eligibility may involve at least 25,000 YouTube subscribers or selection by the server team.</p><p>Eligibility does not mean automatic selection. Benefits depend on the current VML decision.</p></div></div><div class="call" style="margin-top:34px"><h2 style="margin-top:0">Use the official Discord ticket system.</h2><p>There is no separate Creator application URL. Include your channel, videos, and relevant project information in the ticket.</p>${ext('Open official Discord',DC)}</div></div></section>`};
P.minigames={t:'Minigames',h:()=>ph('mini','Direct competition','Minigames','Minigames are a separate environment from Clan Wars. Do not assume currencies, progression, shops, or items transfer.')+`<section class="blk"><div class="wrap"><div class="gg"><div class="gcard"><h3>FFA</h3><p>Free-for-all combat for direct competition.</p></div><div class="gcard"><h3>Duels</h3><p>Focused one-versus-one challenges.</p></div><div class="gcard"><h3>Hunger Games</h3><p>Resource pressure and survival competition.</p></div></div></div></section>`};
P.rules={t:'Rules',h:()=>ph('vamp','The VML standard','Official Server Rules','Welcome to our server! By joining, you accept these rules.')+`<section class="blk"><div class="wrap" style="max-width:860px">${RULES.map((r,i)=>`<article class="rule"><span class="n">${i+1}</span><div><h2>${r[0]}</h2>${r.slice(1).map(p=>`<p>${esc(p)}</p>`).join('')}</div></article>`).join('')}<p style="margin-top:1.6rem">For announcements, support, and verification, please join our Discord:</p>${ext('Open official Discord',DC)}</div></section>`};
const NAV=[['home','Home'],['join','Getting Started'],['factions','Factions'],['clan-wars','Clan Wars'],['minigames','Minigames'],['rules','Rules'],['credits','Credits']];
const PARENT={claims:'clan-wars',clans:'clan-wars',creator:'clan-wars'};
const app=document.getElementById('app'),nav=document.getElementById('nav');
nav.innerHTML=NAV.map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join('');
const strip=h=>h.replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/g,' ').replace(/\s+/g,' ');
const IDX=Object.keys(P).map(k=>({k,t:P[k].t,x:strip(P[k].h())}));
function show(id){if(!P[id])id='home';app.innerHTML=P[id].h();const act=id.startsWith('faction-')?'factions':PARENT[id]||id;
nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===act));nav.classList.remove('open');document.title=(id==='home'?'':P[id].t+' | ')+"Vampire's Magic Live Wiki";window.scrollTo(0,0)}
function navTo(id){location.hash=id}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();document.getElementById('search').classList.remove('open');navTo(g.dataset.go);return}
const sc=e.target.closest('[data-sc]');if(sc){const el=document.getElementById(sc.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
const c=e.target.closest('[data-copy]');if(c){const t=c.dataset.copy,d=()=>{c.textContent='Copied';setTimeout(()=>c.textContent='Copy command',1300)};
if(navigator.clipboard)navigator.clipboard.writeText(t).then(d,d);else d()}});
document.getElementById('bg').onclick=()=>nav.classList.toggle('open');
const S=document.getElementById('search'),Q=document.getElementById('q'),R=document.getElementById('res');
document.getElementById('sb').onclick=()=>{S.classList.toggle('open');if(S.classList.contains('open'))Q.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')S.classList.remove('open')});
Q.oninput=()=>{const q=Q.value.trim().toLowerCase();if(!q){R.innerHTML='';return}
const hits=IDX.map(p=>{const i=p.x.toLowerCase().indexOf(q),ti=p.t.toLowerCase().includes(q);return(i>=0||ti)?{p,i,s:ti?0:1}:null}).filter(Boolean).sort((a,b)=>a.s-b.s);
R.innerHTML=hits.length?hits.map(h=>{const x=h.p.x,i=Math.max(0,h.i-40);return`<button data-go="${h.p.k}"><b>${h.p.t}</b><span>${h.i>=0?esc((i>0?'…':'')+x.slice(i,i+120)+'…'):''}</span></button>`}).join(''):'<span style="color:var(--tx2)">No sections found. Try another word, such as "claim", "clan" or "level".</span>'};
show(location.hash.slice(1));
</script></body></html>
